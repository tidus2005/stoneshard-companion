name: Build Windows portable release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Zig compiler
        run: |
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          Invoke-WebRequest https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip -OutFile .tools/zig.zip
          if ((Get-FileHash .tools/zig.zip -Algorithm SHA256).Hash -ine 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158') { throw 'Zig checksum mismatch' }
          Expand-Archive .tools/zig.zip .tools
      - name: Offline regressions
        run: ./scripts/test-offline.ps1
      - name: Build portable ZIP
        run: ./scripts/build.ps1 -Publish
      - name: Verify extracted portable package
        run: |
          $version = ([xml](Get-Content src/Overlay/StoneshardCompanion.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          ./scripts/test-portable.ps1 -ZipPath "artifacts/release/StoneshardCompanion-$version-win-x64.zip"
      - name: Upload verified assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content src/Overlay/StoneshardCompanion.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          $notes = "docs/releases/$tag.md"
          $zip = "artifacts/release/StoneshardCompanion-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes missing' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $matches = @(Invoke-RestMethod "$api/releases?per_page=100" -Headers $headers | ForEach-Object { $_ } | Where-Object tag_name -eq $tag)
          if ($matches.Count -gt 1) { throw 'Multiple drafts share this version; resolve them before publishing.' }
          $payload = @{ tag_name = $tag; target_commitish = $env:GITHUB_SHA; name = "$tag - Windows 11 x64 portable"; body = (Get-Content -LiteralPath $notes -Raw); draft = $true } | ConvertTo-Json
          if ($matches.Count -eq 1) {
            if (-not $matches[0].draft) { throw 'This release is already public; use a new version instead of replacing its files.' }
            $release = Invoke-RestMethod "$api/releases/$($matches[0].id)" -Headers $headers -Method Patch -ContentType 'application/json; charset=utf-8' -Body $payload
          } else {
            $release = Invoke-RestMethod "$api/releases" -Headers $headers -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload
          }
          # Drafts may not resolve through the tag endpoint. Use their exact ID
          # and upload URL for every mutation and verification.
          foreach ($path in @($zip, "$zip.sha256")) {
            $name = [IO.Path]::GetFileName($path)
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            $old = @($release.assets | Where-Object name -eq $name)
            foreach ($asset in $old) { Invoke-RestMethod "$api/releases/assets/$($asset.id)" -Headers $headers -Method Delete | Out-Null }
            $upload = ($release.upload_url -replace '\{.*\}$', '') + '?name=' + [Uri]::EscapeDataString($name)
            $asset = Invoke-RestMethod $upload -Headers $headers -Method Post -InFile $path -ContentType 'application/octet-stream'
            if ($asset.size -ne (Get-Item -LiteralPath $path).Length -or $asset.digest -ne "sha256:$hash") { throw 'Uploaded asset checksum mismatch' }
          }
          $verified = Invoke-RestMethod "$api/releases/$($release.id)" -Headers $headers
          if (-not $verified.draft -or $verified.assets.Count -ne 2) { throw 'Draft verification failed' }
          Invoke-RestMethod "$api/releases/$($release.id)" -Headers $headers -Method Patch -ContentType 'application/json' -Body '{"draft":false,"make_latest":"true"}' | Out-Null
