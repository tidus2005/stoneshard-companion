name: Build Windows portable release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Install pinned Zig compiler
        run: |
          New-Item -ItemType Directory -Path .tools -Force | Out-Null
          Invoke-WebRequest https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip -OutFile .tools/zig.zip
          if ((Get-FileHash .tools/zig.zip -Algorithm SHA256).Hash -ine 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158') { throw 'Zig checksum mismatch' }
          Expand-Archive .tools/zig.zip .tools
      - name: Offline regressions
        run: ./scripts/test-offline.ps1
      - name: Build portable ZIP
        run: ./scripts/build.ps1 -Publish
      - name: Verify extracted portable package
        run: |
          $version = ([xml](Get-Content src/Overlay/StoneshardCompanion.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          ./scripts/test-portable.ps1 -ZipPath "artifacts/release/StoneshardCompanion-$version-win-x64.zip"
      - name: Upload verified assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content src/Overlay/StoneshardCompanion.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          $notes = "docs/releases/$tag.md"
          $zip = "artifacts/release/StoneshardCompanion-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes missing' }
          $raw = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $raw | ConvertFrom-Json
            if (-not $release.draft) { throw 'This release is already public; use a new version instead of replacing its files.' }
            & gh release edit $tag --target $env:GITHUB_SHA --notes-file $notes
          } else {
            & gh release create $tag --draft --target $env:GITHUB_SHA --title "$tag - Windows 11 x64 portable" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare draft release' }
          & gh release upload $tag $zip "$zip.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $release = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.draft) { throw 'Draft verification failed' }
          foreach ($path in @($zip, "$zip.sha256")) {
            $asset = @($release.assets | Where-Object name -eq ([IO.Path]::GetFileName($path)))
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or $asset[0].size -ne (Get-Item -LiteralPath $path).Length -or $asset[0].digest -ne "sha256:$hash") { throw 'Uploaded asset checksum mismatch' }
          }
          & gh release edit $tag --draft=false --latest --title "$tag - Windows 11 x64 portable"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
